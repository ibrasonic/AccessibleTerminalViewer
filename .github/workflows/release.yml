name: Build and release NVDA add-on

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q addon tests

      - name: Build add-on
        shell: powershell
        run: .\build.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleTerminalViewer
          path: dist/*.nvda-addon

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/*.nvda-addon --verify-tag --generate-notes
